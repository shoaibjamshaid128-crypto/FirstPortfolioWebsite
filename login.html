<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#070913] text-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-6">
    <h2 class="text-2xl font-bold text-center text-cyan-400">Admin Portal</h2>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="text-xs text-slate-400">Email</label>
        <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-cyan-500 outline-none">
      </div>
      <div>
        <label class="text-xs text-slate-400">Password</label>
        <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-cyan-500 outline-none">
      </div>
      <button type="submit" class="w-full py-3 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded-lg transition">Login</button>
      <p id="error-msg" class="text-red-400 text-xs text-center hidden"></p>
    </form>
  </div>
  <script type="module">
    import { auth } from "./firebase-config.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
        window.location.href = 'admin.html';
      } catch (err) {
        const errorEl = document.getElementById('error-msg');
        errorEl.innerText = err.message;
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
